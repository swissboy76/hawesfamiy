name: Save Wikipedia portraits to archive
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_wikipedia_portraits.py'
      - '.github/workflows/wikipedia-portraits.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive-portraits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch attributed images from the exact Wikipedia biographies
        run: python3 scripts/sync_wikipedia_portraits.py
      - name: Commit archived images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/
          if ! git diff --cached --quiet; then
            git commit -m "Archive Wikipedia portraits and source metadata"
            git push
          fi
